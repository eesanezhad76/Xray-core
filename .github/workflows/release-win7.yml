name: Build and Release for Windows 7

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-assets:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    steps:
      - name: Download and verify packaging assets
        shell: bash
        env:
          ASSETVER: 0.14.1
          ASSETHASH: 07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51
        run: |
          set -euo pipefail
          mkdir -p resources
          download_dat() {
            local name="$1" path="$2" expected actual
            expected="$(curl -fsSL "https://raw.githubusercontent.com/XTLS/Xray-rules-dat/release/${path}.dat.sha256sum" | awk '{print $1}')"
            [[ "$expected" =~ ^[0-9a-fA-F]{64}$ ]] || { echo "Invalid checksum for ${name}.dat"; exit 1; }
            curl -fsSL "https://raw.githubusercontent.com/XTLS/Xray-rules-dat/release/${path}.dat" -o "resources/${name}.dat"
            actual="$(sha256sum "resources/${name}.dat" | awk '{print $1}')"
            [[ "$actual" == "$expected" ]] || { echo "SHA-256 mismatch for ${name}.dat"; exit 1; }
            echo "Verified ${name}.dat (${actual})"
          }
          download_dat geoip geoip/geoip-lite
          download_dat geosite geosite/geosite
          curl -fsSL "https://www.wintun.net/builds/wintun-${ASSETVER}.zip" -o wintun.zip
          echo "${ASSETHASH}  wintun.zip" | sha256sum -c -
          unzip -oq wintun.zip -d resources/
          for arch in amd64 x86 arm64; do
            test -s "resources/wintun/bin/${arch}/wintun.dll" || { echo "Missing wintun.dll for ${arch}"; exit 1; }
          done
          test -s resources/wintun/LICENSE.txt
      - name: Upload packaging assets
        uses: actions/upload-artifact@v4
        with:
          name: xray-packaging-assets
          path: resources/
          if-no-files-found: error

  build:
    needs: check-assets
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          # BEGIN Windows 7
          - goos: windows
            goarch: amd64
            assetname: win7-64
          - goos: windows
            goarch: 386
            assetname: win7-32
          # END Windows 7
      fail-fast: false

    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    env:
      GOOS: ${{ matrix.goos}}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: 0
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7

      - name: Download packaging assets
        uses: actions/download-artifact@v4
        with:
          name: xray-packaging-assets
          path: resources

      - name: Show workflow information
        run: |
          _NAME=${{ matrix.assetname }}
          echo "GOOS: ${{ matrix.goos }}, GOARCH: ${{ matrix.goarch }}, RELEASE_NAME: $_NAME"
          echo "ASSET_NAME=$_NAME" >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Setup patched builder
        run: |
          GOSDK=$(go env GOROOT)
          rm -r $GOSDK/*
          cd $GOSDK
          curl -O -L -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://github.com/XTLS/go-win7/releases/latest/download/go-for-win7-linux-amd64.zip
          unzip ./go-for-win7-linux-amd64.zip -d $GOSDK
          rm ./go-for-win7-linux-amd64.zip

      - name: Get project dependencies
        run: go mod download

      - name: Build Xray
        run: |
          mkdir -p build_assets
          COMMID=$(git describe --always --dirty)
          echo 'Building Xray for Windows 7...'
          go build -o build_assets/xray.exe -trimpath -buildvcs=false -gcflags="all=-l=4" -ldflags="-X github.com/xtls/xray-core/core.build=${COMMID} -s -w -buildid=" -v ./main
          # The line below is for without running conhost.exe version. Commented for not being used. Provided for reference.
          # go build -o build_assets/wxray.exe -trimpath -buildvcs=false -gcflags="all=-l=4" -ldflags="-H windowsgui -X github.com/xtls/xray-core/core.build=${COMMID} -s -w -buildid=" -v ./main

      - name: Add additional assets into package
        run: |
          mv -f resources/geo* build_assets/
          if [[ ${GOOS} == 'windows' ]]; then
            cp .github/build/windows/* build_assets/
          fi
          if [[ ${GOOS} == 'windows' ]]; then
            echo 'Adding Wintun into packages'
            if [[ ${GOARCH} == 'amd64' ]]; then
              mv resources/wintun/bin/amd64/wintun.dll build_assets/
            fi
            if [[ ${GOARCH} == '386' ]]; then
              mv resources/wintun/bin/x86/wintun.dll build_assets/
            fi
            mv resources/wintun/LICENSE.txt build_assets/LICENSE-Wintun
          fi

      - name: Copy README.md & LICENSE
        run: |
          cp ${GITHUB_WORKSPACE}/README.md ./build_assets/README.md
          cp ${GITHUB_WORKSPACE}/LICENSE ./build_assets/LICENSE

      - name: Create ZIP archive
        if: github.event_name == 'release'
        shell: bash
        run: |
          pushd build_assets || exit 1
          touch -mt $(date +%Y01010000) *
          zip -9vr ../Xray-${{ env.ASSET_NAME }}.zip .
          popd || exit 1
          FILE=./Xray-${{ env.ASSET_NAME }}.zip
          DGST=$FILE.dgst
          for METHOD in {"md5","sha1","sha256","sha512"}
          do
            openssl dgst -$METHOD $FILE | sed 's/([^)]*)//g' >>$DGST
          done

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        if: github.event_name == 'release'
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./Xray-${{ env.ASSET_NAME }}.zip*
          tag: ${{ github.ref }}
          file_glob: true

      - name: Upload files to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Xray-${{ env.ASSET_NAME }}
          path: |
            ./build_assets/*
