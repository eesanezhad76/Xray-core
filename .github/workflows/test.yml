name: Tests and Checkings

on:
  workflow_dispatch:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-assets:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    steps:
      - name: Download and verify geodata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p resources
          download_dat() {
            local name="$1" path="$2" expected actual
            expected="$(curl -fsSL "https://raw.githubusercontent.com/XTLS/Xray-rules-dat/release/${path}.dat.sha256sum" | awk '{print $1}')"
            [[ "$expected" =~ ^[0-9a-fA-F]{64}$ ]] || { echo "Invalid checksum for ${name}.dat"; exit 1; }
            curl -fsSL "https://raw.githubusercontent.com/XTLS/Xray-rules-dat/release/${path}.dat" -o "resources/${name}.dat"
            actual="$(sha256sum "resources/${name}.dat" | awk '{print $1}')"
            [[ "$actual" == "$expected" ]] || { echo "SHA-256 mismatch for ${name}.dat"; exit 1; }
            echo "Verified ${name}.dat (${actual})"
          }
          download_dat geoip geoip/geoip-lite
          download_dat geosite geosite/geosite
      - name: Upload geodata artifact
        uses: actions/upload-artifact@v4
        with:
          name: xray-geodata
          path: resources/*.dat
          if-no-files-found: error

  check-proto:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7
      - name: Check Proto Version Header
        run: |
          head -n 4 core/config.pb.go > ref.txt
          find . -name "*.pb.go" ! -name "*_grpc.pb.go" -print0 | while IFS= read -r -d '' file; do
            if ! cmp -s ref.txt <(head -n 4 "$file"); then
              echo "Error: Header mismatch in $file"
              head -n 4 "$file"
              exit 1
            fi
          done

  check-format:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    permissions:
      contents: read
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false
      - name: Check Format
        run: go run ./infra/vformat/main.go -mode check -pwd ./

  test:
    needs: check-assets
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7
      - name: Download geodata artifact
        uses: actions/download-artifact@v4
        with:
          name: xray-geodata
          path: resources
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Test
        run: go test -timeout 1h -v ./...
